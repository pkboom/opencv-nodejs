# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: publish on npmjs

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token lets GitHub mint the OIDC token npm's trusted publisher verifies,
    # so no long-lived npm token is needed. The repo default is read-only, so
    # contents must be restated here.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: run apt-get update
        run: sudo apt-get update
      - name: Install libopencv
        run: sudo apt-get install -y libopencv-dev libopencv-features2d-dev
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
      # Skip lifecycle scripts: the addon is built explicitly below, after the
      # TypeScript in this checkout has been compiled.
      - name: Install dependencies using pnpm
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: build CJS + ESM files
        run: pnpm run build
      - name: Show detected OpenCV
        run: node bin/install.js info
      - name: build native modules
        run: node bin/install.js rebuild
      - name: Prepare tests
        run: cd test && pnpm install --frozen-lockfile
      - name: run tests
        run: cd test && pnpm run test
      # Published via npm's trusted publisher (OIDC), configured for this repo
      # and workflow filename on npmjs.com. npm CLI 11.5.1+ is required; Node 24
      # ships it. pnpm is not used here because only the npm CLI implements OIDC.
      - name: Verify npm supports trusted publishing
        run: npm --version
      - name: publish to npmjs
        run: npm publish --access public
