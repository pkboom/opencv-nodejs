name: Use openCV from Apt

on:
  push:
    branches: [ "master", "dev", "*"]
    paths:
      - "cc/**"
      - "src/**"
      - "bin/**"
      - "test/**"
      - "typings/**"
      - "binding.gyp"
      - "package.json"
      - ".github/workflows/prebuild-linux.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "cc/**"
      - "src/**"
      - "bin/**"
      - "test/**"
      - "typings/**"
      - "binding.gyp"
      - "package.json"
      - ".github/workflows/prebuild-linux.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - 24
          - 26

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Install Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}
        cache: 'pnpm'

    # apt's libopencv-dev is OpenCV 4.x; there is no OpenCV 5 apt package yet.
    - name: Install libopencv-dev
      run: |
        sudo apt update
        sudo apt install libopencv-dev

    # Skip lifecycle scripts: the addon is built explicitly below, after the
    # TypeScript in this checkout has been compiled.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Compile TypeScript
      run: pnpm run build

    - name: Show detected OpenCV
      run: node bin/install.js info

    - name: Build native code
      run: node bin/install.js rebuild

    - name: Install test dependencies
      working-directory: ./test
      run: pnpm install --no-frozen-lockfile

    - name: Run tests
      working-directory: ./test
      run: pnpm run test-appveyor
