name: Use openCV from Chocolatey

on:
  push:
    branches: [ "master", "dev", "*" ]
    paths:
      - "cc/**"
      - "src/**"
      - "bin/**"
      - "test/**"
      - "typings/**"
      - "binding.gyp"
      - "package.json"
      - ".github/workflows/prebuild-win64.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "cc/**"
      - "src/**"
      - "bin/**"
      - "test/**"
      - "typings/**"
      - "binding.gyp"
      - "package.json"
      - ".github/workflows/prebuild-win64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - 24
          - 26
        architecture:
          - x64
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Install Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}
        architecture: ${{ matrix.architecture }}
        cache: 'pnpm'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # choco's opencv formula gives whatever OpenCV version it currently ships;
    # we no longer pin an OpenCV version here.
    - name: Install OpenCV
      run: choco install opencv -y

    # Skip lifecycle scripts: the addon is built explicitly below, after the
    # TypeScript in this checkout has been compiled.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Compile TypeScript
      run: pnpm run build

    - name: Show detected OpenCV
      run: node bin/install.js info

    - name: Build native code
      run: node bin/install.js rebuild

    - name: Install test dependencies
      working-directory: ./test
      run: pnpm install --frozen-lockfile

    - name: Run tests
      working-directory: ./test
      run: pnpm run test-appveyor
